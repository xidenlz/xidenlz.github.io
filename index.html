    if (w.el.classList.contains('min')) continue;
    const z = +w.el.style.zIndex;
    if (z > bz) { bz = z; best = k; }
  }
  return best;
}

function openApp(id, arg) {
  closeStart();
  const app = APPS[id];
  if (wins.has(id)) {
    const w = wins.get(id);
    w.el.classList.remove('min');
    focusWin(id);
    if (arg !== undefined && w.api && w.api.go) w.api.go(arg);
    return w;
  }
  const d = $('#desktop').getBoundingClientRect();
  const n = wins.size;
  const W = Math.min(app.w, d.width - 40), H = Math.min(app.h, d.height - 30);
  const x = app.x != null ? app.x : Math.max(10, (d.width - W) / 2 + n * 26 - 40);
  const y = app.y != null ? app.y : Math.max(10, (d.height - H) / 2 + n * 22 - 30);

  const el = document.createElement('section');
  el.className = 'win';
  el.setAttribute('aria-label', app.title);
  el.style.cssText = `left:${Math.min(x, d.width - W - 10)}px;top:${Math.min(y, d.height - H - 10)}px;width:${W}px;height:${H}px`;
  el.innerHTML = `<div class="tb">${app.icon}<span class="tt">${esc(app.title)}</span><div class="ctl">
      <button type="button" class="mn" aria-label="Minimize">${CTL.min}</button>
      <button type="button" class="mx" aria-label="Maximize">${CTL.max}</button>
      <button type="button" class="x" aria-label="Close">${CTL.x}</button></div></div><div class="wb"></div>`;
  $('#desktop').appendChild(el);

  const task = document.createElement('button');
  task.type = 'button'; task.className = 'task'; task.title = app.title;
  task.innerHTML = `${app.icon}<span>${esc(app.short || app.title)}</span>`;
  $('#tasks').appendChild(task);

  const w = { el, task, api: null };
  wins.set(id, w);
  w.api = app.render(el.querySelector('.wb'), arg) || null;

  el.addEventListener('pointerdown', () => focusWin(id));
  el.querySelector('.mn').onclick = e => { e.stopPropagation(); minimize(id); };
  el.querySelector('.mx').onclick = () => el.classList.toggle('max');
  el.querySelector('.x').onclick = e => { e.stopPropagation(); closeWin(id); };
  task.onclick = () => {
    if (el.classList.contains('min')) { el.classList.remove('min'); focusWin(id); }
    else if (topVisible() === id) minimize(id);
    else focusWin(id);
  };
  drag(el, id);
  focusWin(id);
  return w;
}

function minimize(id) {
  const w = wins.get(id);
  w.el.classList.add('min');
  w.task.classList.remove('front');
  const t = topVisible();
  if (t) focusWin(t);
}
function closeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.el.remove(); w.task.remove(); wins.delete(id);
  const t = topVisible();
  if (t) focusWin(t);
}

function drag(el, id) {
  const bar = el.querySelector('.tb');
  bar.addEventListener('dblclick', e => { if (!e.target.closest('.ctl') && !mobile()) el.classList.toggle('max'); });
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.ctl') || el.classList.contains('max') || mobile()) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    const d = $('#desktop').getBoundingClientRect();
    bar.setPointerCapture(e.pointerId);
    const mv = ev => {
      const nx = Math.min(Math.max(ox + ev.clientX - sx, 80 - el.offsetWidth), d.width - 80);
      const ny = Math.min(Math.max(oy + ev.clientY - sy, 0), d.height - 36);
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', mv);
    bar.addEventListener('pointerup', up);
  });
}

function wrap(t, n) {
  const out = []; let line = '';
  for (const w of t.split(' ')) {
    if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; } else line += ' ' + w;
  }
  if (line.trim()) out.push(line.trim());
  return out;
}

      const page = new DOMParser().parseFromString(await res.text(), 'text/html');
      const art = page.querySelector('article.prose');

      art.querySelectorAll('[src]').forEach(el => el.setAttribute('src', new URL(el.getAttribute('src'), url).href));

      const by = page.querySelector('.byline');

      doc.querySelector('.body').append(...art.childNodes);
      const hs = [...doc.querySelectorAll('.body h2')];
      hs.forEach((h, i) => { h.id = 'r-h' + i; });
      toc.innerHTML = hs.length ? `<h4>On this page</h4>` + hs.map((h, i) => `<a href="#r-h${i}" data-h="${i}">${esc(h.textContent)}</a>`).join('') : '';
      onScroll();
    } catch (err) {
      doc.innerHTML = `<div class="rmsg">Couldn't load this article inside the desktop.<br><a href="${url.href}">Open the full page →</a></div>`;
    }
  }

  function onScroll() {
    const max = sc.scrollHeight - sc.clientHeight;
    bar.style.width = (max > 0 ? sc.scrollTop / max * 100 : 0) + '%';
    let on = -1;
    toc.querySelectorAll('a').forEach((a, i) => {
      const h = doc.querySelector('#r-h' + i);
      if (h && h.offsetTop - sc.scrollTop < 120) on = i;
    });
    toc.querySelectorAll('a').forEach((a, i) => a.classList.toggle('on', i === on));
  }
  sc.addEventListener('scroll', onScroll, { passive: true });
  toc.addEventListener('click', e => {
    const a = e.target.closest('a[data-h]'); if (!a) return;
    e.preventDefault();
    sc.scrollTop = doc.querySelector('#r-h' + a.dataset.h).offsetTop - 12;
  });
  doc.addEventListener('click', e => {
    const b = e.target.closest('button[data-go]');
    if (b) load(READABLE[+b.dataset.go].href);
  });
  body.querySelector('.rbar').addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'prev' && idx > 0) load(READABLE[idx - 1].href);
    if (a === 'next' && idx < READABLE.length - 1) load(READABLE[idx + 1].href);
    if (a === 'smaller' || a === 'bigger') {
      fs = Math.min(21, Math.max(13, fs + (a === 'bigger' ? 1 : -1)));
      doc.style.setProperty('--rfs', fs + 'px');
      try { localStorage.setItem('reader-fs', fs); } catch {}
    }
  });
  load(first || READABLE[0].href);
  return { go: load };
}

document.addEventListener('click', e => {

  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault();

function renderExplorer(body, arg) {
  const FOLDERS = {
    projects: { name: 'Projects', icon: IC.folder, items: PROJECTS.map(p => ({ name: p.file, icon: IC.file, meta: p.kind.split(' · ')[0], p })) },
    research: { name: 'Research', icon: IC.folderB, items: RESEARCH.map(r => ({ name: r.title, icon: IC.html, meta: r.wip ? 'in progress' : r.date.replace(/^(\w{3})\w*/, '$1'), r })) },
    blog: { name: 'Blog', icon: IC.folderB, items: BLOG.map(r => ({ name: r.title, icon: IC.html, meta: r.date.replace(/^(\w{3})\w*/, '$1'), r })) },
  };
  body.innerHTML = `
    <div class="addr"><span style="color:var(--faint)">←  →  ↑</span><div class="path"></div></div>
    <div class="exp">
      <div class="side">${Object.entries(FOLDERS).map(([k, f]) => `<button type="button" data-f="${k}">${f.icon}${f.name}</button>`).join('')}
        <button type="button" data-ext="https://github.com/xidenlz">${IC.gh}GitHub ↗</button></div>
      <div class="files"></div>
      <aside class="detail"></aside>
    </div>
    <div class="status"><span class="cnt"></span><span class="sel"></span></div>`;
  const files = body.querySelector('.files'), det = body.querySelector('.detail');
  let folder = 'projects';

  function detail(it) {
    if (!it) { det.innerHTML = `<div class="empty">Select a file to see its details.</div>`; return; }
    if (it.p) {
      const p = it.p;
      det.innerHTML = `<div class="kick">${esc(p.kind)}</div><h3>${esc(p.title)}</h3><div class="when">${esc(p.stack)}</div>
        <p>${esc(p.dek)}</p>
        <ul class="hl">${p.hl.map(([a, b]) => `<li><b>${esc(a)}</b>${esc(b)}</li>`).join('')}</ul>
        <ul class="tagz">${p.tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
        ${p.link ? `<a class="open" href="${p.link[1]}" target="_blank" rel="noopener">${esc(p.link[0])} ↗</a>` : `<p style="font-family:var(--mono);font-size:11px">; private tooling, no public source</p>`}`;
    } else {
      const r = it.r;
      det.innerHTML = `<div class="kick">${esc(r.cat)}</div><h3>${esc(r.title)}</h3><div class="when">${esc(r.date)}</div>
        <p>${esc(r.dek)}</p>
        <ul class="tagz">${r.tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
        ${r.href ? `<a class="open" href="${ROOT + r.href}" data-read="${r.href}">Read it →</a>` : `<p style="font-family:var(--mono);font-size:11px">; STATUS_PENDING, still reversing</p>`}`;
    }
  }
  function go(k) {
    folder = FOLDERS[k] ? k : 'projects';
    const f = FOLDERS[folder];
    body.querySelectorAll('.side button[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === folder));
    body.querySelector('.path').innerHTML = `This PC › musaed › <b>${f.name}</b>`;
    files.innerHTML = `<div class="fhead"><span></span><span>Name</span><span>${folder === 'projects' ? 'Type' : 'Date'}</span></div>` +
      f.items.map((it, i) => `<button type="button" class="frow" data-i="${i}">${it.icon}<span class="nm">${esc(it.name)}</span><span class="meta">${esc(it.meta)}</span></button>`).join('');
    body.querySelector('.cnt').textContent = `${f.items.length} items`;
    pick(0);
  }
  function pick(i) {
    files.querySelectorAll('.frow').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    const it = FOLDERS[folder].items[i];
    detail(it);
    body.querySelector('.sel').textContent = it ? '1 item selected' : '';
  }
  body.querySelector('.side').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ext) window.open(b.dataset.ext, '_blank', 'noopener'); else go(b.dataset.f);
  });
  files.addEventListener('click', e => { const b = e.target.closest('.frow'); if (b) pick(+b.dataset.i); });
  files.addEventListener('dblclick', e => {
    const b = e.target.closest('.frow'); if (!b) return;
    const it = FOLDERS[folder].items[+b.dataset.i];
    if (it.r && it.r.href) openReader(it.r.href);
    else if (it.p && it.p.link) window.open(it.p.link[1], '_blank', 'noopener');
  });
  go(arg || 'projects');
  return { go };
}

const DESK = [
  ['ida', 'Research.idb', IC.ida], ['pe', 'musaed.exe', IC.pe], ['about', 'about.txt', IC.note],
  ['explorer', 'Projects', IC.folder, 'projects'], ['explorer', 'Blog', IC.folderB, 'blog'],

];

});
function closeStart() { $('#smenu').classList.remove('on'); $('#startbtn').classList.remove('on'); }
$('#startbtn').onclick = e => { e.stopPropagation(); const on = $('#smenu').classList.toggle('on'); $('#startbtn').classList.toggle('on', on); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStart(); });

$('#shutdown').onclick = () => { closeStart(); $('#bsod').classList.add('on'); };
$('#bsod').onclick = () => { $('#bsod').classList.remove('on'); boot(); };

function tick() {
  const d = new Date();
  $('#clock').innerHTML = `${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}<br>${d.toLocaleDateString()}`;
}
tick(); setInterval(tick, 15000);

let booted = false;
function boot() {
  const b = $('#boot');
  b.classList.remove('gone');
  booted = false;
  let seen = false;
  try { seen = sessionStorage.getItem('booted') === '1'; } catch {}
  const done = () => {
    if (booted) return; booted = true;
    b.classList.add('gone');
    try { sessionStorage.setItem('booted', '1'); } catch {}
    if (!wins.size) {
      if (!mobile()) {
        openApp('ida');
        const t = openApp('pe'), d = $('#desktop').getBoundingClientRect();
        t.el.style.left = Math.max(20, d.width - t.el.offsetWidth - 30) + 'px';
        t.el.style.top = Math.max(20, d.height - t.el.offsetHeight - 24) + 'px';
      }
    }
  };
  b.onclick = done;
  setTimeout(done, seen ? 250 : 1700);
}
boot();
</script>
