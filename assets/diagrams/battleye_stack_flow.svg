<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .sub-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
    .step-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; }
  </style>

  <rect width="760" height="700" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <g transform="translate(140, 30)">
    <rect width="480" height="68" rx="8" fill="url(#cardGrad)" stroke="#25334d" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#38bdf8" />
    <text x="24" y="28" class="title-text">1. Target Thread Identification</text>
    <text x="24" y="48" class="mono-code">PsLookupThreadByThreadId(ThreadId, &amp;Thread)</text>
    <text x="440" y="38" class="step-badge">0x01</text>
  </g>

  <line x1="380" y1="98" x2="380" y2="132" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(140, 136)">
    <rect width="480" height="74" rx="8" fill="url(#cardGrad)" stroke="#25334d" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="74" rx="2" fill="#38bdf8" />
    <text x="24" y="28" class="title-text">2. Kernel APC Dispatch</text>
    <text x="24" y="46" class="sub-text">Initializes APC object and enqueues to target thread context</text>
    <text x="24" y="62" class="mono-code">KeInitializeApc(...) + KeInsertQueueApc(...)</text>
    <text x="440" y="42" class="step-badge">0x02</text>
  </g>

  <line x1="380" y1="210" x2="380" y2="244" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(140, 248)">
    <rect width="480" height="74" rx="8" fill="url(#cardGrad)" stroke="#25334d" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="74" rx="2" fill="#38bdf8" />
    <text x="24" y="28" class="title-text">3. Stack Frame Capture</text>
    <text x="24" y="46" class="sub-text">Captures return addresses in target thread context</text>
    <text x="24" y="62" class="mono-code">RtlWalkFrameChain(Frames, 0x100, 0)</text>
    <text x="440" y="42" class="step-badge">0x03</text>
  </g>

  <line x1="380" y1="322" x2="380" y2="356" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(140, 360)">
    <rect width="480" height="82" rx="8" fill="url(#cardGrad)" stroke="#25334d" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="82" rx="2" fill="#38bdf8" />
    <text x="24" y="28" class="title-text">4. Image Boundary Verification</text>
    <text x="24" y="46" class="sub-text">Validates addresses against loaded module bounds</text>
    <text x="24" y="66" class="mono-code">if (FrameAddr &lt; Base || FrameAddr &gt;= Base + Size)</text>
    <text x="440" y="45" class="step-badge">0x04</text>
  </g>

  <line x1="380" y1="442" x2="380" y2="476" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(140, 480)">
    <rect width="480" height="74" rx="8" fill="url(#cardGrad)" stroke="#25334d" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="74" rx="2" fill="#38bdf8" />
    <text x="24" y="28" class="title-text">5. Metadata &amp; Report Aggregation</text>
    <text x="24" y="46" class="sub-text">Correlates frame buffers, module offsets, and thread context</text>
    <text x="440" y="42" class="step-badge">0x05</text>
  </g>

  <line x1="380" y1="554" x2="380" y2="588" stroke="#34d399" stroke-width="2" />

  <g transform="translate(140, 592)">
    <rect width="480" height="68" rx="8" fill="#0f2027" stroke="#34d399" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#34d399" />
    <text x="24" y="28" class="title-text" style="fill: #34d399;">6. Telemetry Dispatch</text>
    <text x="24" y="48" class="mono-code" style="fill: #6ee7b7;">BEDaisy::Report::ThreadStackReport</text>
    <text x="440" y="38" class="step-badge" style="fill: #34d399;">0x06</text>
  </g>

</svg>
